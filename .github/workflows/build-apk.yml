name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# Cần quyền ghi để tạo bản phát hành (Release) cho app tự cập nhật
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Chưa có secret KEYSTORE_BASE64 / KEYSTORE_PASSWORD. Vào Settings > Secrets and variables > Actions để thêm (xem README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mytivi.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/mytivi.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk MyTivi-Tab.apk

      # Build lỗi: gom các dòng lỗi (Kotlin "e: ...", tài nguyên, "What went wrong") thành một
      # thông báo lỗi hiện ngay trên trang Actions, khỏi phải mở cả log dài để tìm.
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |^ERROR|error: |What went wrong" -A1 build.log | grep -v '^--$' | head -80 > errors.txt || true
          if [ -s errors.txt ]; then
            msg=$(sed -e 's/%/%25/g' -e 's#file:///home/runner/work/[^/]*/[^/]*/##' errors.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Lỗi build::${msg}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MyTivi-Tab-apk
          path: MyTivi-Tab.apk

      # Tạo Release "v<số lượt build>" kèm MyTivi-Tab.apk; app đọc bản này để tự cập nhật
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "$TAG" MyTivi-Tab.apk \
            --title "MyTivi Tab 1.0.${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest \
            || gh release upload "$TAG" MyTivi-Tab.apk --clobber
